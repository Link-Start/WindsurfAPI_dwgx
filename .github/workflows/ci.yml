name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual mutation sweep (Actions -> CI -> Run workflow). Deliberately NOT on the PR path:
  # each mutation re-runs its spec's whole test suite, so all 42 specs is hours, and a gate
  # nobody can afford to run is worse than no gate — that is the warning in the specs job's
  # own comment. Until 2026-09-13 nothing in this repo ever executed `npm run mutate`.
  workflow_dispatch:
    inputs:
      specs:
        description: 'Spec files to run (space separated). Blank = every test/mutations/*.json'
        required: false
        default: ''

jobs:
  mutations:
    name: Mutation specs (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Runs each spec in its own process and prints a one-line verdict per spec, so a
      # failure names a spec instead of burying it in an interleaved log.
      #
      # `baseline pass=N but spec expects M` is NOT a survivor — mutate-verify refuses to
      # score that spec, and this step reports it as SKIPPED-STALE so a stale baseline and
      # a real survivor never look the same.
      - name: Sweep
        run: |
          set -u
          SPECS="${{ inputs.specs }}"
          if [ -z "$SPECS" ]; then SPECS=$(ls test/mutations/*.json); fi
          fail=0
          for s in $SPECS; do
            echo "::group::$s"
            out=$(npm run --silent mutate -- "$s" 2>&1); code=$?
            echo "$out"
            echo "::endgroup::"
            caught=$(printf '%s' "$out" | grep -c 'CAUGHT' || true)
            survived=$(printf '%s' "$out" | grep -c 'SURVIVED' || true)
            if printf '%s' "$out" | grep -q 'spec expects'; then
              echo "VERDICT $s SKIPPED-STALE (baseline drift — no verdict is trustworthy)"
              fail=1
            elif [ $code -ne 0 ]; then
              echo "VERDICT $s FAIL exit=$code CAUGHT=$caught SURVIVED=$survived"
              fail=1
            else
              echo "VERDICT $s OK CAUGHT=$caught SURVIVED=$survived"
            fi
          done
          exit $fail

      - name: Summary
        if: always()
        run: echo "Verdicts are the 'VERDICT <spec> ...' lines above — one per spec."

  syntax:
    name: Node syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check JS syntax for all src files
        run: |
          find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"

      - name: Validate JSON configs
        run: |
          for f in $(find . -maxdepth 2 -name '*.json' -not -path './node_modules/*' -not -path './.git/*'); do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f'))"
          done

  # Mutation-spec consistency. Three baseline/anchor drifts reached master in one week
  # (#241's anchors, retry-rescue 82/87 -> 88, reasoning-continuity 289 -> 300) and the
  # test suite saw none of them: it does not run specs. These checks read files only and
  # cost ~0.3s, so they are mandatory rather than a local habit someone has to remember.
  #
  # Baseline VALUE drift is deliberately NOT checked here — it needs a real test run per
  # spec (~40 min for all 25). That is the post-merge sweep: scripts/spec-baseline-audit.mjs.
  specs:
    name: Mutation spec consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Anchors unique, specs well-formed
        run: node scripts/spec-static-check.mjs

      - name: Secret scan (includes test/ — half of a typical diff lives there)
        run: node scripts/secret-scan.mjs

  test:
    name: Unit tests shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # image-resize.test.js imports jimp (the sole runtime dependency), so the
      # runner needs node_modules — without this step every shard that touches
      # a jimp-importing test fails with ERR_MODULE_NOT_FOUND.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:shard -- ${{ matrix.shard }} 4
